name: Sacar clips

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Enlace del vídeo (YouTube, Google Drive, Dropbox o enlace directo .mp4)"
        required: true
      clips:
        description: "Cuántos clips sacar (si no pones tramos)"
        default: "5"
      tramos:
        description: "Opcional: tramos a mano, ej. 1:20-2:05, 10:00-10:45"
        default: ""
      formato:
        description: "blur = vídeo entero con fondo desenfocado; crop = recorte a pantalla completa"
        type: choice
        options: [blur, crop]
        default: blur
      idioma:
        description: "es, en o auto"
        default: "auto"

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q faster-whisper yt-dlp gdown

      - name: Descargar vídeo
        env:
          URL: ${{ inputs.url }}
        run: |
          if echo "$URL" | grep -q "drive.google.com"; then
            gdown --fuzzy "$URL" -O video.mp4
          else
            yt-dlp -f "bv*[height<=1080]+ba/b" --merge-output-format mp4 -o video.mp4 "$URL"
          fi
          ls -lh video.mp4

      - name: Cortar clips
        env:
          CLIPS: ${{ inputs.clips }}
          TRAMOS: ${{ inputs.tramos }}
          FORMATO: ${{ inputs.formato }}
          IDIOMA: ${{ inputs.idioma }}
        run: |
          python clipper.py video.mp4 --clips "$CLIPS" --times "$TRAMOS" --mode "$FORMATO" --lang "$IDIOMA"

      - name: Guardar clips para descargar
        uses: actions/upload-artifact@v4
        with:
          name: clips
          path: clips/
          retention-days: 7
